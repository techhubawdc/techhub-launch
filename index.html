# TECH HUB Launch Website — `index.html`

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH HUB — Official Launch</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02030a;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    position:relative;
}

/* FUTURISTIC BACKGROUND */
.background{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 50%, rgba(0,140,255,.16), transparent 35%),
        radial-gradient(circle at 20% 30%, rgba(120,0,255,.12), transparent 30%),
        #02030a;
}

.grid{
    position:absolute;
    inset:-50%;
    background-image:
        linear-gradient(rgba(0,180,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,.08) 1px, transparent 1px);
    background-size:60px 60px;
    transform:perspective(500px) rotateX(60deg);
    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    from{transform:perspective(500px) rotateX(60deg) translateY(0);}
    to{transform:perspective(500px) rotateX(60deg) translateY(60px);}
}

/* PARTICLES */
.particles{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#6ee7ff;
    box-shadow:0 0 12px #00c8ff;
    animation:float 5s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    20%{opacity:1;}
    80%{opacity:1;}
    to{
        transform:translateY(-10vh) scale(1.2);
        opacity:0;
    }
}

/* WHITE FRAME */
.frame{
    position:absolute;
    inset:22px;
    border:3px solid rgba(255,255,255,.9);
    pointer-events:none;
    z-index:20;
    box-shadow:
        0 0 15px rgba(255,255,255,.15),
        inset 0 0 15px rgba(255,255,255,.05);
}

/* CORNER DETAILS */
.corner{
    position:absolute;
    width:55px;
    height:55px;
    border-color:#6ee7ff;
    z-index:21;
}

.tl{
    top:-3px;
    left:-3px;
    border-top:4px solid;
    border-left:4px solid;
}

.tr{
    top:-3px;
    right:-3px;
    border-top:4px solid;
    border-right:4px solid;
}

.bl{
    bottom:-3px;
    left:-3px;
    border-bottom:4px solid;
    border-left:4px solid;
}

.br{
    bottom:-3px;
    right:-3px;
    border-bottom:4px solid;
    border-right:4px solid;
}

/* MAIN CONTENT */
.screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    z-index:10;
}

/* BOOT */
.boot{
    transition:opacity 1s ease;
}

.small{
    font-size:clamp(14px,2vw,25px);
    letter-spacing:7px;
    color:#72e6ff;
    margin-bottom:20px;
}

.loading{
    width:min(500px,60vw);
    height:4px;
    background:rgba(255,255,255,.12);
    overflow:hidden;
    margin:25px auto;
}

.loading-bar{
    height:100%;
    width:0%;
    background:#5de7ff;
    box-shadow:0 0 20px #00d9ff;
    animation:loading 3s forwards;
}

@keyframes loading{
    to{width:100%;}
}

/* COUNTDOWN */
.countdown{
    display:none;
}

.count-number{
    font-size:clamp(100px,20vw,280px);
    font-weight:900;
    line-height:1;
    color:white;
    text-shadow:
        0 0 20px #00d9ff,
        0 0 60px #006eff,
        0 0 120px #7b00ff;
    animation:countPulse 1s ease;
}

@keyframes countPulse{
    0%{transform:scale(1.7);opacity:0;}
    60%{transform:scale(.95);opacity:1;}
    100%{transform:scale(1);}
}

/* ACTIVATION */
.activation{
    display:none;
}

.activation button{
    margin-top:35px;
    padding:20px 45px;
    font-size:clamp(16px,2vw,26px);
    font-weight:bold;
    letter-spacing:3px;
    color:white;
    background:rgba(0,130,255,.12);
    border:2px solid #62e8ff;
    cursor:pointer;
    box-shadow:
        0 0 20px rgba(0,200,255,.4),
        inset 0 0 20px rgba(0,200,255,.08);
    transition:.3s;
}

.activation button:hover{
    transform:scale(1.05);
    background:rgba(0,180,255,.25);
    box-shadow:
        0 0 40px #00c8ff,
        inset 0 0 30px rgba(0,200,255,.15);
}

/* ACCESS */
.access{
    display:none;
}

.access-text{
    font-size:clamp(18px,3vw,40px);
    letter-spacing:8px;
    color:#65f5ff;
    text-shadow:0 0 30px #00d9ff;
}

/* FINAL */
.final{
    display:none;
}

.techhub{
    font-size:clamp(70px,13vw,190px);
    font-weight:900;
    letter-spacing:10px;
    background:linear-gradient(90deg,#ffffff,#67eaff,#ffffff,#a66cff,#ffffff);
    background-size:300%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shine 3s linear infinite;
    text-shadow:0 0 45px rgba(0,200,255,.35);
}

@keyframes shine{
    from{background-position:0%;}
    to{background-position:300%;}
}

.tagline{
    margin-top:25px;
    font-size:clamp(14px,2vw,28px);
    letter-spacing:8px;
    color:#d8faff;
}

.online{
    margin-top:35px;
    color:#63ffb0;
    letter-spacing:5px;
    font-size:clamp(13px,1.5vw,20px);
}

/* ENERGY FLASH */
.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
    z-index:50;
    pointer-events:none;
}

.flash.active{
    animation:flash .7s ease;
}

@keyframes flash{
    0%{opacity:0;}
    30%{opacity:.9;}
    100%{opacity:0;}
}

/* HIDE */
.hidden{
    display:none !important;
}
</style>
</head>

<body>

<div class="background"></div>
<div class="grid"></div>
<div class="particles" id="particles"></div>

<div class="frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
</div>

<div class="flash" id="flash"></div>

<!-- BOOT SCREEN -->
<div class="screen boot" id="boot">
    <div class="small">SYSTEM INITIALIZATION</div>

    <div style="font-size:clamp(30px,5vw,70px);font-weight:bold;">
        TECH HUB
    </div>

    <div class="loading">
        <div class="loading-bar"></div>
    </div>

    <div style="color:#8ca4b8;letter-spacing:4px;">
        LOADING TECHNOLOGY CORE...
    </div>
</div>

<!-- COUNTDOWN -->
<div class="screen countdown" id="countdown">
    <div class="small">TECH HUB LAUNCH SEQUENCE</div>
    <div class="count-number" id="number">10</div>
</div>

<!-- ACTIVATION -->
<div class="screen activation" id="activation">
    <div class="small">FINAL SYSTEM CHECK</div>

    <div style="font-size:clamp(30px,5vw,70px);font-weight:bold;">
        READY TO LAUNCH
    </div>

    <button onclick="activateTechHub()">
        ⚡ ACTIVATE TECH HUB
    </button>
</div>

<!-- ACCESS -->
<div class="screen access" id="access">
    <div class="access-text">
        ACCESS GRANTED
    </div>

    <div style="margin-top:25px;color:#91a8ba;letter-spacing:5px;">
        TECHNOLOGY CORE ONLINE
    </div>
</div>

<!-- FINAL -->
<div class="screen final" id="final">

    <div class="techhub">
        TECH HUB
    </div>

    <div class="tagline">
        CODE • CREATE • CONNECT • CONQUER
    </div>

    <div class="online">
        ● SYSTEM ONLINE
    </div>

</div>

<script>

/* CREATE PARTICLES */
const particleBox = document.getElementById("particles");

for(let i=0;i<80;i++){

    const p=document.createElement("div");
    p.className="particle";

    p.style.left=Math.random()*100+"%";
    p.style.animationDelay=Math.random()*5+"s";
    p.style.animationDuration=(3+Math.random()*5)+"s";
    p.style.opacity=Math.random();

    particleBox.appendChild(p);
}


/* ELEMENTS */
const boot=document.getElementById("boot");
const countdown=document.getElementById("countdown");
const activation=document.getElementById("activation");
const access=document.getElementById("access");
const finalScreen=document.getElementById("final");
const number=document.getElementById("number");
const flash=document.getElementById("flash");


/* START COUNTDOWN AFTER BOOT */
setTimeout(()=>{

    boot.style.opacity="0";

    setTimeout(()=>{

        boot.style.display="none";
        countdown.style.display="flex";

        startCountdown();

    },1000);

},3500);


/* COUNTDOWN */
function startCountdown(){

    let n=10;

    number.innerText=n;

    const timer=setInterval(()=>{

        n--;

        if(n>0){

            number.innerText=n;

            number.style.animation="none";

            void number.offsetWidth;

            number.style.animation="countPulse 1s ease";

        }else{

            clearInterval(timer);

            countdown.style.display="none";

            activation.style.display="flex";
        }

    },1000);
}


/* ACTIVATE */
function activateTechHub(){

    activation.style.display="none";

    flash.classList.add("active");

    setTimeout(()=>{

        access.style.display="flex";

    },300);

    setTimeout(()=>{

        access.style.display="none";
        finalScreen.style.display="flex";

    },2200);
}

</script>

</body>
</html>
```
