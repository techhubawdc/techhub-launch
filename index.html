<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>TECH HUB — Grand Launch</title>

<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:
    radial-gradient(circle at center,#071b35 0%,#02040a 55%,#000 100%);
}

button{
    font:inherit;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
}


/* =========================
   GRID
========================= */

.grid{
    position:absolute;
    inset:-50%;

    background-image:
        linear-gradient(rgba(0,180,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,180,255,.08) 1px,transparent 1px);

    background-size:55px 55px;

    transform:
        perspective(500px)
        rotateX(60deg);

    animation:gridMove 8s linear infinite;

    pointer-events:none;
}

@keyframes gridMove{

    to{
        transform:
            perspective(500px)
            rotateX(60deg)
            translateY(55px);
    }

}


/* =========================
   PARTICLES
========================= */

.particles{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#65eaff;

    box-shadow:
        0 0 12px #00cfff;

    animation:
        float 5s linear infinite;
}

@keyframes float{

    from{
        transform:translateY(100vh);
        opacity:0;
    }

    20%,80%{
        opacity:1;
    }

    to{
        transform:translateY(-10vh);
        opacity:0;
    }

}


/* =========================
   SCREEN
========================= */

.screen{
    position:absolute;
    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    text-align:center;

    z-index:10;
